services:
  # ─── API Gateway ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: devsactum-nginx
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nestjs-api
      - go-api
    networks:
      - devsactum-net
    restart: unless-stopped

  # ─── NestJS API (Auth, Jobs, Payments) ────────────────────────────
  nestjs-api:
    build:
      context: ./nestjs-api
      dockerfile: Dockerfile
    container_name: devsactum-nestjs
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - nestjs-uploads:/app/uploads
    networks:
      - devsactum-net
    restart: unless-stopped

  # ─── Go API (Feed, Communities, Reputation - quick reads) ─────────
  go-api:
    build:
      context: ./go-api
      dockerfile: Dockerfile
    container_name: devsactum-go
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - devsactum-net
    restart: unless-stopped

  # ─── Python Workers (AI, notifications, background jobs) ──────────
  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: devsactum-python
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - devsactum-net
    restart: unless-stopped

  # ─── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: devsactum-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - devsactum-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis (Cache + Sessions) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devsactum-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - devsactum-net
    restart: unless-stopped

  # ─── MinIO (S3-compatible object storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: devsactum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - devsactum-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO Bucket Setup ────────────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: devsactum-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/${MINIO_BUCKET} --ignore-existing;
      mc policy set public local/${MINIO_BUCKET};
      echo 'MinIO bucket created successfully';
      "
    networks:
      - devsactum-net
    restart: "no"

  # ─── RabbitMQ (Message broker) ────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: devsactum-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - devsactum-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  nestjs-uploads:

networks:
  devsactum-net:
    driver: bridge
