name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend/devsactum-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./Frontend/devsactum-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/go-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ./backend/go-api/go.sum
      - run: go mod download
      - run: go vet ./...

  nestjs-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/nestjs-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./backend/nestjs-api/package-lock.json
      - run: npm ci
      - run: npm run build
