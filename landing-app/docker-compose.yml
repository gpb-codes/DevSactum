version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_GO_URL=http://localhost:8000
    networks:
      - devsactum-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - microservice
    environment:
      - NODE_ENV=production
      - GO_SERVICE_URL=http://microservice:8000
    networks:
      - devsactum-net

  microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GO_PORT=8000
    networks:
      - devsactum-net

networks:
  devsactum-net:
    driver: bridge
