services:
  web:
    build:
      context: ./Frontend/devsactum-next
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_NESTJS_URL=http://localhost:8001
    depends_on:
      - go-api
      - nestjs-api

  go-api:
    build:
      context: ./backend/go-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://devsactum:devsactum@db:5432/devsactum
      - PORT=8000
    depends_on:
      - db

  nestjs-api:
    build:
      context: ./backend/nestjs-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=devsactum
      - DB_PASSWORD=devsactum
      - DB_NAME=devsactum
      - JWT_SECRET=devsactum-secret-key-change-in-production
      - PORT=8001
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: devsactum
      POSTGRES_PASSWORD: devsactum
      POSTGRES_DB: devsactum
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
